<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<title>Mitt rum</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main>
  <header>
    <div>
      <div class="eyebrow">RUMSOBSERVATORIUM</div>
      <h1 id="title">Mitt rum</h1>
      <p id="subtitle">Klimat, väder och tid på ett ställe.</p>
    </div>
    <div class="time">
      <div id="clock" class="clock">--:--</div>
      <div id="date" class="date"></div>
      <span id="mode" class="badge">ANSLUTER</span>
    </div>
  </header>

  <div id="message" class="message" role="status" aria-live="polite" hidden></div>

  <section class="top-grid">
    <article class="card scene">
      <div class="tag"><span>JUST NU</span><span id="source">–</span></div>
      <svg id="room" viewBox="0 0 640 360" preserveAspectRatio="xMidYMax slice" role="img" aria-labelledby="room-title">
        <title id="room-title">Illustrerat rum med fönster, skrivbord, lampa och växt</title>
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop id="sky-top" offset="0" stop-color="#5d8db0"/>
            <stop id="sky-bottom" offset="1" stop-color="#b9cfc4"/>
          </linearGradient>
          <radialGradient id="lamp-glow" cx="0.5" cy="0" r="1">
            <stop offset="0" stop-color="#f3cf8a" stop-opacity=".55"/>
            <stop offset="1" stop-color="#f3cf8a" stop-opacity="0"/>
          </radialGradient>
          <clipPath id="window-clip"><rect x="92" y="58" width="176" height="150" rx="3"/></clipPath>
        </defs>
        <!-- wall and floor -->
        <rect width="640" height="360" fill="#1b241b"/>
        <rect y="282" width="640" height="78" fill="#151c15"/>
        <rect y="278" width="640" height="6" fill="#26321f"/>
        <!-- window -->
        <g clip-path="url(#window-clip)">
          <rect x="92" y="58" width="176" height="150" fill="url(#sky)"/>
          <circle id="sun" cx="226" cy="98" r="15" fill="#f1d58f"/>
          <g id="moon" display="none">
            <circle cx="222" cy="96" r="13" fill="#e9e4c9"/>
            <circle cx="229" cy="91" r="11" fill="#2a3a4e" id="moon-bite"/>
          </g>
          <g id="stars" fill="#e9e4c9" display="none">
            <circle cx="120" cy="80" r="1.3"/><circle cx="160" cy="70" r="1"/><circle cx="185" cy="110" r="1.2"/>
            <circle cx="132" cy="128" r="1"/><circle cx="250" cy="140" r="1.1"/><circle cx="205" cy="74" r=".9"/>
          </g>
          <g id="clouds" fill="#d9e0d6" opacity=".9" display="none">
            <ellipse cx="140" cy="102" rx="34" ry="12"/><ellipse cx="160" cy="94" rx="22" ry="13"/>
            <ellipse cx="214" cy="126" rx="30" ry="10"/><ellipse cx="232" cy="119" rx="18" ry="11"/>
          </g>
          <g id="rain" stroke="#bcd0d8" stroke-width="1.6" stroke-linecap="round" opacity=".8" display="none">
            <path d="M110 140l-6 14M135 150l-6 14M160 138l-6 14M185 152l-6 14M210 140l-6 14M235 150l-6 14M255 138l-6 14M122 172l-6 14M172 176l-6 14M222 172l-6 14"/>
          </g>
          <g id="snow" fill="#eef2ee" display="none">
            <circle cx="110" cy="140" r="2"/><circle cx="140" cy="160" r="2"/><circle cx="168" cy="138" r="2"/>
            <circle cx="196" cy="170" r="2"/><circle cx="226" cy="146" r="2"/><circle cx="254" cy="166" r="2"/>
            <circle cx="124" cy="186" r="2"/><circle cx="210" cy="190" r="2"/>
          </g>
          <!-- skyline -->
          <path d="M92 208v-34h22v-12h18v20h16v-30h24v40h20v-18h20v22h18v-14h22v26z" fill="#2c3a2c" opacity=".85"/>
        </g>
        <rect x="88" y="54" width="184" height="158" rx="5" fill="none" stroke="#6f7f5c" stroke-width="8"/>
        <path d="M180 58v150M92 133h176" stroke="#6f7f5c" stroke-width="4"/>
        <rect x="80" y="210" width="200" height="10" rx="2" fill="#7c8b66"/>
        <!-- plant on sill -->
        <path d="M110 210h26l-4-20h-18z" fill="#c4875f"/>
        <path d="M123 190c-12-18-2-30 0-34 2 4 12 16 0 34M123 190c-18-6-20-18-20-22 6 2 18 8 20 22M123 190c16-8 20-18 20-24-6 4-18 10-20 24" fill="#8ead73"/>
        <!-- thermometer on the wall -->
        <g transform="translate(318 84)">
          <rect x="0" y="0" width="64" height="86" rx="6" fill="#222d20" stroke="#3d4b35"/>
          <text id="wall-temp" x="32" y="40" text-anchor="middle" fill="#e5e8d9" font-size="20" font-weight="600">–</text>
          <text id="wall-co2" x="32" y="64" text-anchor="middle" fill="#9fac93" font-size="11">– ppm</text>
          <circle id="air-dot" cx="32" cy="76" r="3.5" fill="#9fac93"/>
        </g>
        <!-- lamp -->
        <g id="lamp-light" display="none"><path d="M478 98L420 286h176z" fill="url(#lamp-glow)"/></g>
        <path d="M508 286V120l-30-20" stroke="#8c977c" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M454 84l38 0 10 22h-58z" fill="#d79971"/>
        <rect x="490" y="282" width="36" height="6" rx="2" fill="#8c977c"/>
        <!-- desk -->
        <rect x="330" y="230" width="270" height="10" rx="2" fill="#a07a58"/>
        <rect x="344" y="240" width="8" height="46" fill="#7d5f45"/>
        <rect x="578" y="240" width="8" height="46" fill="#7d5f45"/>
        <rect x="398" y="160" width="104" height="64" rx="4" fill="#2a352a" stroke="#4b5e3e" stroke-width="3"/>
        <path id="screen-line" d="M408 206l18-14 16 8 20-20 18 10 12-8" stroke="#aebf91" stroke-width="2.5" fill="none"/>
        <rect x="444" y="224" width="12" height="6" fill="#4b5e3e"/>
        <rect x="532" y="214" width="14" height="16" rx="3" fill="#d3b877"/>
        <!-- rug and chair -->
        <ellipse cx="420" cy="326" rx="190" ry="20" fill="#2b3a27"/>
        <ellipse cx="420" cy="326" rx="160" ry="14" fill="none" stroke="#3d5136" stroke-width="3" stroke-dasharray="10 8"/>
        <path d="M380 250h44v6h-44zM384 256l-6 60M420 256l6 60M402 256v58" stroke="#5d6b4f" stroke-width="5" fill="none" stroke-linecap="round"/>
        <rect x="378" y="196" width="10" height="56" rx="3" fill="#5d6b4f"/>
        <!-- stale-air haze -->
        <rect id="haze" width="640" height="360" fill="#c9a86b" opacity="0"/>
      </svg>
      <div class="caption">
        <div>
          <span class="eyebrow">I RUMMET</span>
          <h2 id="headline">Hämtar läget…</h2>
          <p id="advice"></p>
        </div>
      </div>
    </article>

    <div class="climate">
      <article class="card metric" id="card-temperature">
        <div class="eyebrow">TEMPERATUR</div>
        <div class="value"><span class="num">–</span><span class="unit">°C</span></div>
        <div class="status"></div>
        <div class="sub"></div>
      </article>
      <article class="card metric" id="card-humidity">
        <div class="eyebrow">LUFTFUKTIGHET</div>
        <div class="value"><span class="num">–</span><span class="unit">%</span></div>
        <div class="status"></div>
        <div class="sub"></div>
      </article>
      <article class="card metric" id="card-co2">
        <div class="eyebrow">KOLDIOXID</div>
        <div class="value"><span class="num">–</span><span class="unit">ppm</span></div>
        <div class="status"></div>
        <div class="sub"></div>
      </article>
    </div>
  </section>

  <section class="bottom-grid">
    <article class="card weather">
      <div class="heading">
        <div>
          <div class="eyebrow">VÄDRET UTE</div>
          <h2 id="place">Väder</h2>
        </div>
        <div id="weather-icon" class="wicon" aria-hidden="true"></div>
      </div>
      <div class="wnow">
        <div class="value"><span id="out-temp" class="num">–</span><span class="unit">°C</span></div>
        <div>
          <div id="out-desc" class="wdesc">–</div>
          <div id="out-more" class="sub"></div>
        </div>
      </div>
      <dl class="today">
        <div><dt>Idag</dt><dd id="out-minmax">–</dd></div>
        <div><dt>Soluppgång</dt><dd id="sunrise">–</dd></div>
        <div><dt>Solnedgång</dt><dd id="sunset">–</dd></div>
      </dl>
      <div id="hours" class="hours"></div>
      <p id="weather-note" class="note"></p>
    </article>

    <article class="card chart-card">
      <div class="heading">
        <div>
          <div class="eyebrow">ÖVER TID</div>
          <h2 id="chart-title">Temperatur inne och ute</h2>
        </div>
        <select id="range" aria-label="Tidsintervall">
          <option value="6">Senaste 6 timmarna</option>
          <option value="24" selected>Senaste dygnet</option>
          <option value="168">Senaste veckan</option>
        </select>
      </div>
      <div class="tabs" role="tablist">
        <button role="tab" data-chart="temperature" aria-selected="true">Temperatur</button>
        <button role="tab" data-chart="humidity" aria-selected="false">Luftfuktighet</button>
        <button role="tab" data-chart="co2" aria-selected="false">Koldioxid</button>
      </div>
      <div id="legend" class="legend"></div>
      <div id="chart" class="chart"></div>
      <p id="chart-note" class="note"></p>
    </article>
  </section>

  <footer>
    <span><i class="dot"></i>Data stannar på den här datorn.</span>
    <span id="updated"></span>
  </footer>
</main>
<script src="./app.js"></script>
</body>
</html>
